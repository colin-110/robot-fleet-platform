# Production overlay for the hosted server (deploy/README.md):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Instead of docker-compose.override.yml (development: hot reload, mounted
# code, the database port open). Differences from the base file:
# - The dashboard is published on 80 and 443 on every interface; nothing else
#   is (the API, broker and database stay on localhost, and the AWS security
#   group opens 80 and 443 only).
# - Its certificate comes from Let's Encrypt (the `certbot` service below)
#   instead of the local CA, so browsers trust it. The broker keeps the local
#   CA: only the simulator, inside Docker, connects to it.
# - Images come from the GitHub Container Registry, built by CI for the commit
#   being deployed (IMAGE_TAG, set by deploy/deploy.sh): a 1 GB server cannot
#   compile the broker.
# - Sized for 1 GB: 20 simulated robots (SIMULATED_ROBOTS) and a smaller
#   database cache.
# - The simulation runs 4 times faster than real life (SIMULATION_SPEED), so a
#   visitor sees batteries drain and charge, components wear out and get
#   repaired, within minutes rather than hours. Local runs are real time.

services:
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/colin-110}/fleetops-backend:${IMAGE_TAG:-latest}
    environment:
      # At most 30 connections, under the database's 60 below.
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20

  simulator:
    image: ${IMAGE_REGISTRY:-ghcr.io/colin-110}/fleetops-simulator:${IMAGE_TAG:-latest}
    command: !override [ "python", "-u", "robot_sim.py", "--api-url", "http://backend:8000/api/v1/telemetry", "--workers", "1", "--robots", "${SIMULATED_ROBOTS:-20}", "--mqtt-host", "mqtt", "--mqtt-port", "8883", "--mqtt-ca", "/certs/ca.crt", "--outbox-dir", "/data", "--time-scale", "${SIMULATION_SPEED:-4}" ]

  db:
    image: ${IMAGE_REGISTRY:-ghcr.io/colin-110}/fleetops-db:${IMAGE_TAG:-latest}
    command: postgres -c synchronous_commit=off -c max_connections=60 -c shared_buffers=96MB

  mqtt:
    image: ${IMAGE_REGISTRY:-ghcr.io/colin-110}/fleetops-mqtt:${IMAGE_TAG:-latest}

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/colin-110}/fleetops-frontend:${IMAGE_TAG:-latest}
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - web_certs:/etc/nginx/certs:ro
      - acme_webroot:/var/www/certbot:ro

  # Run on demand by deploy/deploy.sh (first certificate) and the renewal
  # timer (deploy/renew-cert.sh); never started by `up`.
  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [ "certbot" ]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      # Where the deploy hook copies a new certificate for nginx.
      - web_certs:/web-certs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  web_certs:
  acme_webroot:
  letsencrypt:
