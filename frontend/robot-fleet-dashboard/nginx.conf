# Plain HTTP only sends browsers to HTTPS, apart from Let's Encrypt's check
# that this server controls the name (docker-compose.prod.yml). Locally the
# folder is empty and nothing is served from it.
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Certificates come from the compose service `certs` (tls/make-certs.sh).
    listen 443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:fleet_tls:10m;
    ssl_session_tickets off;

    # Browser hardening, sent with every response (the location blocks below
    # add no headers of their own, so they inherit these).
    # The policy allows only what the dashboard loads: its own scripts and
    # styles, Google Fonts, OpenStreetMap tiles, and its own API and WebSocket
    # through this server. No inline scripts (the theme script is a file for
    # this reason), no eval, no plugins, and no framing by other sites.
    # Inline styles stay allowed: React and Leaflet set them on elements.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Browsers use HTTPS for this host for a day without asking. Short on
    # purpose while the certificate comes from a local CA; a public deployment
    # with a trusted certificate would use a year.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Force dynamic DNS resolution for Docker
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:8000";

    # Serve static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests to the backend container
    location /ws {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
