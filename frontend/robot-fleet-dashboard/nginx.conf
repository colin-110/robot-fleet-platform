server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Browser hardening, sent with every response (the location blocks below
    # add no headers of their own, so they inherit these).
    # The policy allows only what the dashboard loads: its own scripts and
    # styles, Google Fonts, OpenStreetMap tiles, and its own API and WebSocket
    # through this server. No inline scripts (the theme script is a file for
    # this reason), no eval, no plugins, and no framing by other sites.
    # Inline styles stay allowed: React and Leaflet set them on elements.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Force dynamic DNS resolution for Docker
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:8000";

    # Serve static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests to the backend container
    location /ws {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
