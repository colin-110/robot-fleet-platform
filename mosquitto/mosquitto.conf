# Mosquitto broker for FleetOps (with mosquitto-go-auth).
#
# Robots log in as robot-<id> with their device key; the API logs in as the
# service account with the master key. Every login and ACL decision is made by
# the API (app/routes/mqtt_auth.py) and cached here.

listener 1883
protocol mqtt
allow_anonymous false
# The client id is replaced by the username, so a client can never connect
# under another client's id and take over its session (and the messages queued
# in it). Each robot therefore has exactly one session, robot-<id>.
use_username_as_clientid true

# ── Persistence and queues ──────────────────────────────────────────
# QoS 1 messages for a disconnected persistent session (the API's ingest
# consumer while it restarts, or a robot that is offline) are queued here and
# saved to disk every few seconds.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 5
max_queued_messages 100000
# Unacknowledged messages in flight to one client. The ingest consumer acks a
# whole batch after it commits, so this must be larger than a batch.
max_inflight_messages 1000
# Sessions of robots that never come back are dropped after a week.
persistent_client_expiration 7d
max_packet_size 65536

# ── Logging ─────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# ── Auth via the API ────────────────────────────────────────────────
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host backend
auth_opt_http_port 8000
auth_opt_http_getuser_uri /internal/mqtt/user
auth_opt_http_superuser_uri /internal/mqtt/superuser
auth_opt_http_aclcheck_uri /internal/mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
auth_opt_log_level warn
# Cache decisions so steady traffic costs no HTTP calls. A revoked key may
# still log in for up to auth_cache_seconds, but the ACL check denies its
# topics as soon as the cached ACL results expire.
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 60

# ── Extra listeners ─────────────────────────────────────────────────
# Empty in development. Production mounts mosquitto/tls.conf here: a TLS
# listener on 8883 for robots on the internet (docker-compose.ec2.yml).
include_dir /mosquitto/conf.d
