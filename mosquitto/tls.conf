# TLS listener for robots on the internet, mounted into /mosquitto/conf.d by
# docker-compose.ec2.yml. Plain 1883 stays on the internal Docker network for
# the API and the demo simulator; only 8883 is published.
#
# The certificate is the host's Let's Encrypt one, copied where the broker's
# user (uid 1000) can read it by scripts/mqtt_certs.sh, which certbot runs
# after every renewal. Robots verify it against the system CAs.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
