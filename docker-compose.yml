# Every container keeps at most 30 MB of logs (the json-file driver is
# unbounded by default).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Docker's default of 1,024 open files caps the broker below 1,000 robots (one
# socket each), and the simulator needs several per robot (its connection and
# outbox files). Raised for the services that hold one per robot.
# Published ports listen on this host's loopback only: nothing here is
# encrypted (plain HTTP and MQTT), and the API and broker should not be
# reachable from the rest of the network by accident. Set BIND_ADDRESS=0.0.0.0
# to expose them on purpose, for example to robots on the LAN.

x-ulimits: &many-files
  nofile:
    soft: 65536
    hard: 65536

services:

  backend:
    build: ./backend
    image: robot-fleet-platform-backend:latest
    command: [ "sh", "-c", "python prestart.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --no-access-log" ]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
      # The dashboard's nginx is always in front, so the client's address is
      # the last X-Forwarded-For entry it appends. With 0, every browser was
      # nginx's one address: one person guessing passwords would have used up
      # the sign-in limit for everyone. (Port 8000 is published on this
      # machine only, so nothing else can reach the API to forge the header.)
      - TRUSTED_PROXY_COUNT=1
      - PYTHONPATH=.
      # One process: it owns the broker session that ingest runs on.
      - MQTT_ENABLED=true
      - MQTT_HOST=mqtt
    restart: unless-stopped
    logging: *default-logging
    ulimits: *many-files
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      # Liveness only, no database query (see /health/live in app/main.py),
      # and with Python, so the image needs no curl.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fleet_net

  frontend:
    build: ./frontend/robot-fleet-dashboard
    ports:
      # HTTPS; plain HTTP only redirects to it.
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - tls_certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - fleet_net

  simulator:
    # From the repository root: the image installs the agent package.
    build:
      context: .
      dockerfile: simulator/Dockerfile
    # No --api-key: a command-line secret is visible in `ps aux` and
    # `docker inspect`. The simulator reads TELEMETRY_API_KEY from the
    # environment, which env_file already provides.
    command: [ "python", "-u", "robot_sim.py", "--api-url", "http://backend:8000/api/v1/telemetry", "--workers", "1", "--robots", "40", "--mqtt-host", "mqtt", "--mqtt-port", "8883", "--mqtt-ca", "/certs/ca.crt", "--outbox-dir", "/data" ]
    env_file:
      - ./backend/.env
    volumes:
      # The local CA, to verify the broker over TLS as a real robot would.
      - tls_certs:/certs:ro
      # Each robot's outbox, so readings not yet stored survive a restart.
      - simulator_outbox:/data
    restart: unless-stopped
    logging: *default-logging
    ulimits: *many-files
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fleet_net

  db:
    # TimescaleDB: telemetry is a hypertable with compression and retention.
    build: ./timescaledb
    image: robot-fleet-platform-db:latest
    command: postgres -c synchronous_commit=off -c max_connections=200 -c shared_buffers=256MB
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleet_net

  mqtt:
    # Mosquitto with mosquitto-go-auth: robots log in with their device keys,
    # and every login and ACL decision is delegated to the API. Built from
    # source with current versions (mosquitto/Dockerfile).
    build: ./mosquitto
    image: robot-fleet-platform-mqtt:latest
    ports:
      # TLS only. Plain MQTT (1883) stays inside the Docker network, for the API.
      - "${BIND_ADDRESS:-127.0.0.1}:8883:8883"
    restart: unless-stopped
    logging: *default-logging
    ulimits: *many-files
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      # Owned by the broker's user in the image, so a new volume is writable.
      - mosquitto_data:/var/lib/mosquitto
      - tls_certs:/mosquitto/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      - fleet_net

  # One-off: makes the local CA and the broker's and dashboard's certificate on
  # first start, then exits (tls/make-certs.sh). Later starts keep them.
  certs:
    image: alpine:3.22
    command: [ "sh", "-c", "apk add --no-cache -q openssl && sh /scripts/make-certs.sh" ]
    environment:
      - TLS_EXTRA_SANS=${TLS_EXTRA_SANS:-}
    volumes:
      - ./tls/make-certs.sh:/scripts/make-certs.sh:ro
      - tls_certs:/certs
      # The CA's private key: in no other service's volume.
      - tls_ca:/ca
    logging: *default-logging

volumes:
  tls_certs:
  tls_ca:
  timescale_data:
  mosquitto_data:
  simulator_outbox:

networks:
  fleet_net:
    driver: bridge
