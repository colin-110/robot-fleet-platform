name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ── CI: Backend Lint & Tests ───────────────────────────────────────
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: fleet_test_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
      - name: Install dependencies & linters
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install ruff
      # Blocking, unlike the previous `|| echo warning` step which could never
      # fail the build.
      - name: Lint (ruff)
        run: |
          cd backend && ruff check app tests
          cd .. && ruff check scripts simulator
      - name: Check formatting (ruff format)
        run: cd backend && ruff format --check app tests
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/fleet_test_db
          REDIS_URL: redis://localhost:6379/0
          TELEMETRY_API_KEY: ci-test-key-not-a-real-secret
          OPT_REDIS_BUFFER: "false"
          PYTHONPATH: .
        run: cd backend && pytest tests/ -v --cov=app --cov-report=term-missing

  # ── CI: Frontend Lint & Build ──────────────────────────────────────
  frontend-test:
    name: Frontend Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the frontend Dockerfile's node:22-alpine build stage, so CI
          # and the shipped image agree. Node 20 reached end of life in April
          # 2026 and is below jsdom 30's floor of ^22.22.2, which surfaced as an
          # undici/webidl TypeError the moment the test step was added.
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/robot-fleet-dashboard/package-lock.json
      - run: cd frontend/robot-fleet-dashboard && npm ci
      - run: cd frontend/robot-fleet-dashboard && npm run lint
      # Blocking, like the backend suite. Vitest reads its env from
      # vite.config.js, so the run does not depend on a local .env.
      - name: Run Vitest
        run: cd frontend/robot-fleet-dashboard && npm run test:coverage
      - run: cd frontend/robot-fleet-dashboard && npm run build

  # ── CD: Build & publish images to GitHub Container Registry ─────────
  # Runs only on pushes to main, after tests pass. Produces deployable,
  # versioned images that any host (EC2, ECS, k8s) can pull — no building
  # on the target box required.
  publish-images:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend/robot-fleet-dashboard
          # The deployed stack pulls all three; without this the host would
          # still have to build the simulator locally, which is the failure
          # mode docker-compose.aws.yml exists to avoid.
          - name: simulator
            context: ./simulator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/robot-fleet-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/robot-fleet-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CD: Deploy to AWS (opt-in) ─────────────────────────────────────
  # Gated so the pipeline stays green until AWS is wired up. To enable:
  #   1. Provision the host with scripts/deploy_aws.ps1. It tags the instance
  #      role=fleet-app, attaches the SSM instance profile without which the
  #      agent never registers, and bootstraps the Docker install and the
  #      /opt/fleetops checkout that the rollout below acts on.
  #   2. On the host: write backend/.env (see backend/.env.example), and
  #      `docker login ghcr.io` if the GHCR packages are private.
  #   3. Create the OIDC deploy role with scripts/setup_oidc_role.ps1. It
  #      prints the ARN and the two gh commands that finish the wiring:
  #      secret AWS_DEPLOY_ROLE_ARN and variable ENABLE_AWS_DEPLOY = true.
  # The instance then pulls the freshly published GHCR images and restarts.
  deploy-aws:
    name: Deploy to AWS (EC2 via SSM)
    runs-on: ubuntu-latest
    needs: [ publish-images ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOY == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Roll out new images to the app host
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the targets first. `send-command` accepts a tag target that
          # matches nothing and still returns success, so an untagged host - or
          # one whose SSM agent never registered - produced a green deploy that
          # ran nowhere. scripts/deploy_aws.ps1 applies the tag and the instance
          # profile; this is the check that the two still agree.
          ids=$(aws ssm describe-instance-information --filters "Key=tag:role,Values=fleet-app" "Key=PingStatus,Values=Online" --query "InstanceInformationList[].InstanceId" --output text)
          if [ -z "$ids" ]; then
            echo "::error::No online SSM-managed instance is tagged role=fleet-app."
            exit 1
          fi
          echo "Deploying $SHA to: $ids"

          # Reset to the deployed SHA rather than origin/main: main may already
          # have moved, and the compose file and prometheus.yml on the host have
          # to come from the same commit as the images IMAGE_TAG pins.
          read -r -d "" remote <<SCRIPT || true
          set -eu
          cd /opt/fleetops
          git fetch origin main
          git reset --hard $SHA
          export IMAGE_TAG=$SHA
          docker compose -f docker-compose.aws.yml -p fleetops pull
          docker compose -f docker-compose.aws.yml -p fleetops up -d --remove-orphans
          # The superseded images are dead weight on a 7.6 GB disk.
          docker image prune -f
          SCRIPT

          params=$(jq -n --arg s "$remote" '{commands:[$s],executionTimeout:["1800"]}')
          cid=$(aws ssm send-command --instance-ids $ids --document-name AWS-RunShellScript --comment "Deploy ${SHA:0:7}" --parameters "$params" --query "Command.CommandId" --output text)
          echo "SSM command: $cid"

          # send-command only queues the work. Without waiting on the result the
          # job goes green while the rollout fails on the box, which is how a
          # broken deploy stays invisible until someone loads the site.
          inv() { aws ssm get-command-invocation --command-id "$cid" --instance-id "$1" --query "$2" --output text; }

          failed=0
          for id in $ids; do
            deadline=$((SECONDS + 900))
            while :; do
              status=$(inv "$id" Status 2>/dev/null || echo Pending)
              case "$status" in
                Success) break ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated) failed=1; break ;;
              esac
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for $id (last status: $status)"
                failed=1
                break
              fi
              sleep 10
            done

            echo "::group::$id -> $status"
            inv "$id" StandardOutputContent || true
            stderr=$(inv "$id" StandardErrorContent || true)
            if [ -n "$stderr" ] && [ "$stderr" != "None" ]; then
              echo "--- stderr ---"
              echo "$stderr"
            fi
            echo "::endgroup::"
          done

          exit $failed
