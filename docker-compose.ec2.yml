# Production: one EC2 instance running the backend and simulator.
#
# No worker and no frontend container (Vercel serves the dashboard). nginx and
# Let's Encrypt run on the host. Postgres (Neon) and Redis (Upstash) are
# external; their URLs come from .env on the host.
#
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ec2.yml -p fleetops pull
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ec2.yml -p fleetops up -d
#
# IMAGE_TAG defaults to `latest`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/colin-110/robot-fleet-backend:${IMAGE_TAG:-latest}
    command: ["sh", "-c", "python prestart.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"]
    env_file: [./.env]
    environment:
      - PYTHONPATH=.
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /health/live, not /health: the latter queries the database, and a
      # query every 15s would keep a serverless database from ever suspending.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging
    networks: [fleet_net]

  simulator:
    image: ghcr.io/colin-110/robot-fleet-simulator:${IMAGE_TAG:-latest}
    # --always-active: telemetry stays continuous whether or not anyone is
    # viewing the dashboard.
    command: ["python", "-u", "robot_sim.py", "--api-url", "http://backend:8000/api/v1/telemetry", "--workers", "1", "--robots", "24", "--always-active"]
    env_file: [./.env]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    networks: [fleet_net]

networks:
  fleet_net:
    driver: bridge
