# The benchmark stack: everything the product runs, sized for a 512 MB host.
# Self-contained (no backend/.env needed). Run it with bench/run.py.
#
# Memory limits add up to 480 MB, leaving room for the OS on a 512 MB
# instance with a little swap. Postgres is tuned to match.

name: fleetbench

x-env: &env
  TELEMETRY_API_KEY: bench-master-key-not-a-secret
  DATABASE_URL: postgresql://fleet:fleet@db:5432/fleet

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    command: >
      postgres -c shared_buffers=48MB -c effective_cache_size=96MB
      -c work_mem=2MB -c maintenance_work_mem=16MB -c max_connections=30
      -c max_worker_processes=4 -c timescaledb.max_background_workers=2
      -c wal_buffers=4MB -c synchronous_commit=on
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
      TIMESCALEDB_TELEMETRY: "off"
    mem_limit: 200m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleet -d fleet" ]
      interval: 3s
      retries: 20

  mqtt:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    volumes:
      - ../mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
    mem_limit: 48m

  backend:
    build: ../backend
    command: [ "sh", "-c", "python prestart.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --no-access-log" ]
    environment:
      <<: *env
      PYTHONPATH: .
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      LOG_LEVEL: WARNING
      ALLOW_SHARED_INGEST_KEY: "false"
    ports:
      - "18100:8000"
    mem_limit: 160m
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 3s
      retries: 30

  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    command: [ "python", "-u", "robot_sim.py", "--api-url", "http://backend:8000/api/v1/telemetry", "--robots", "${ROBOTS:-24}", "--mqtt-host", "mqtt", "--outbox-dir", "/data" ]
    environment:
      <<: *env
    mem_limit: 72m
    depends_on:
      backend:
        condition: service_healthy
