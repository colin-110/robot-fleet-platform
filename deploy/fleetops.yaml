AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FleetOps demo host on Amazon Lightsail: one 1 GB server running the whole
  Docker Compose stack (API, dashboard, broker, TimescaleDB, 20 simulated
  robots) behind HTTPS on a static IP, for a fixed $7 a month that includes the
  disk, the public IPv4 address and the traffic. Only ports 80 and 443 are
  open; deploy/remote.sh opens SSH to the deployer's address only while it
  runs. Images are built by CI, never on this server. Synthetic data only.

Metadata:
  com.aws.cloudformation.Context:
    why: >-
      Cheapest setup that runs the stack as it runs locally, at a predictable
      monthly cost; everything in one stack so deleting it removes every
      resource and stops all charges. Lightsail's price includes the disk and
      public IP that EC2 bills separately ($7 against $11.40 for a t4g.micro).

Parameters:
  BundleId:
    Type: String
    Default: micro_3_0
    AllowedValues: [ micro_3_0, small_3_0, medium_3_0 ]
    Description: micro_3_0 is 1 GB at $7 a month; small_3_0 is 2 GB at $12.
  RepoUrl:
    Type: String
    Default: https://github.com/colin-110/robot-fleet-platform.git
    Description: Public Git repository the server clones.

Resources:
  Server:
    Type: AWS::Lightsail::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Installs Docker, the Compose plugin, git and 2 GB of swap (headroom
          for 1 GB of memory), then clones the repository; deploy/deploy.sh
          does the rest. A public website has to accept visitors from anywhere,
          so 80 (only redirects to HTTPS and answers Let's Encrypt's check) and
          443 are open to all addresses. SSH is closed: deploy/remote.sh opens
          it to its own address only while it runs.
        must: >-
          Never open the API, broker or database ports here, and never leave
          SSH open; keep UserData free of secrets (deploy/deploy.sh makes them
          on the server).
    Properties:
      InstanceName: !Sub "${AWS::StackName}-server"
      AvailabilityZone: !Sub "${AWS::Region}a"
      BlueprintId: amazon_linux_2023
      BundleId: !Ref BundleId
      Networking:
        Ports:
          - { FromPort: 80, ToPort: 80, Protocol: tcp, Cidrs: [ 0.0.0.0/0 ], Ipv6Cidrs: [ "::/0" ] }
          - { FromPort: 443, ToPort: 443, Protocol: tcp, Cidrs: [ 0.0.0.0/0 ], Ipv6Cidrs: [ "::/0" ] }
      UserData: !Sub |
        #!/bin/bash
        set -euxo pipefail
        dnf install -y docker git
        systemctl enable --now docker
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
          https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-x86_64
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
        swapon -a
        [ -d /opt/fleetops/.git ] || git clone ${RepoUrl} /opt/fleetops
        touch /var/lib/fleetops-ready
      Tags:
        - { Key: Project, Value: fleetops }

  StaticIp:
    Type: AWS::Lightsail::StaticIp
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          A fixed address (free while attached), so the free hostname built
          from it (a-b-c-d.sslip.io) and its Let's Encrypt certificate stay
          valid across server restarts.
    Properties:
      StaticIpName: !Sub "${AWS::StackName}-ip"
      AttachedTo: !Ref Server

Outputs:
  InstanceName:
    Value: !Ref Server
  PublicIp:
    Value: !GetAtt StaticIp.IpAddress
  Hostname:
    Description: Free hostname that resolves to the static IP (sslip.io).
    Value: !Join [ "", [ !Join [ "-", !Split [ ".", !GetAtt StaticIp.IpAddress ] ], ".sslip.io" ] ]
