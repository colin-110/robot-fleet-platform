# Secret scanning (gitleaks, run in CI over the whole history). The default
# rules, minus two known false positives found by scanning every commit:
# - the broker image name, which contains "auth" and a version string;
# - the empty, commented-out JWT_SECRET= line in backend/.env.example;
# - the go-auth source commit pinned in mosquitto/Dockerfile (a public git hash).
[extend]
useDefault = true

[allowlist]
description = "Known false positives, matched against the whole finding"
regexTarget = "match"
regexes = [
  '''mosquitto-go-auth:[0-9.]+-mosquitto_[0-9.]+''',
  '''JWT_SECRET=\s*\n''',
  '''GO_AUTH_COMMIT=[0-9a-f]{40}''',
]
